version: "2"

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/danilov-go/gophprofile

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - contextcheck
    - noctx
    - canonicalheader
    - bodyclose
    - errorlint
    - errname
    - modernize
    - embeddedstructfieldcheck
    - revive
    - misspell
    - testifylint
    - thelper

  settings:
    govet:
      enable:
        - appends
        - asmdecl
        - assign
        - atomic
        - bools
        - buildtag
        - cgocall
        - composite
        - copylock
        - defers
        - directive
        - errorsas
        - framepointer
        - hostport
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - printf
        - shift
        - sigchanyzer
        - slog
        - stdmethods
        - stdversion
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - timeformat
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
        - waitgroup
    revive:
      rules:
        - name: exported
          disabled: true
    testifylint:
      enable-all: true  

  exclusions:
    paths:
      - "mocks\\.go$"
      - "mock_.*\\.go$"
      - "/mocks/"