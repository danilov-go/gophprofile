services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:latest
    command: server /data
    env_file: .env
    volumes:
      - minio_data:/data

  server:
    build: .
    command: ["./server"]
    restart: on-failure
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data: